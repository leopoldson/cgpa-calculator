  <rect x="182" y="250" width="46" height="110" rx="10" fill="rgba(255,255,255,0.5)"/>
  <rect x="252" y="200" width="46" height="160" rx="10" fill="rgba(255,255,255,0.7)"/>
  <rect x="322" y="140" width="46" height="220" rx="10" fill="url(#bar4)"/>

  <!-- small checkmark badge on tallest bar -->
  <circle cx="345" cy="122" r="26" fill="#10B981" stroke="#1E293B" stroke-width="6"/>
  <path d="M333 122 L342 131 L358 111" fill="none" stroke="white" stroke-width="7"
